# =========================================================
# Cabeçalhos de segurança — Tarefaa
# =========================================================
# Coloque estes add_header no bloco `server { ... }` do site (HTTPS)
# no nginx da VPS. Se você usa add_header dentro de `location`, lembre
# que ele SOBRESCREVE os de nível server — então prefira o nível server,
# ou repita em cada location relevante.
#
# Depois de recarregar o nginx (nginx -t && systemctl reload nginx),
# teste o app inteiro. A CSP está em modo REPORT-ONLY (não bloqueia,
# só avisa no console do navegador). Quando o console estiver limpo,
# troque o nome do header para "Content-Security-Policy" (enforce).
# =========================================================

# Força HTTPS por 1 ano. Ative "preload" só quando tiver certeza de que
# TODOS os subdomínios servem HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Anti-clickjacking (não permite embutir o site em iframes de terceiros)
add_header X-Frame-Options "SAMEORIGIN" always;

# Não deixa o navegador "adivinhar" o tipo do conteúdo
add_header X-Content-Type-Options "nosniff" always;

# Vaza o mínimo de referrer
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Desliga APIs sensíveis que o app não usa
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content-Security-Policy — comece em REPORT-ONLY.
# Ajuste o host do Supabase se mudar de projeto.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://khnsqupkdnouimonughn.supabase.co wss://khnsqupkdnouimonughn.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# Quando o console estiver limpo, comente a linha acima e habilite esta
# (enforce):
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://khnsqupkdnouimonughn.supabase.co wss://khnsqupkdnouimonughn.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; object-src 'none'" always;
