# =========================================================
# Cabeçalhos de segurança — Tarefaa (versão em produção)
# =========================================================
# Coloque estes add_header no bloco `server { ... }` do container nginx
# do tarefaa (/opt/stacks/tarefaa/nginx.conf) e recrie o serviço:
#   docker service update --force tarefaa_tarefaa
#
# NOTA: 'wasm-unsafe-eval' no script-src é necessário para o Argon2id
# (WebAssembly) do Cofre de Senhas.
# =========================================================

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://khnsqupkdnouimonughn.supabase.co wss://khnsqupkdnouimonughn.supabase.co https://challenges.cloudflare.com https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; object-src 'none'" always;
